name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: 语法检查（node --check）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查（遍历所有 JS 源文件）
        run: node scripts/ci-check.mjs

  # 后端 SQL 自检：analytics 起库时会跑 pt_security_selfcheck()（fail-closed）。
  # 这里再补一层「迁移脚本可被提取」的冒烟检查，避免 psql 脚本语法坏掉才在运行时发现。
  migrate-smoke:
    name: 迁移脚本冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验 001/002/003 迁移文件存在且非空
        run: |
          for f in analytics/backend/db/001_init.sql \
                   analytics/backend/db/002_attribution_index.sql \
                   analytics/backend/db/003_add_x_platform.sql \
                   analytics/schema/003_delivery.sql; do
            test -s "$f" || { echo "缺失或为空：$f"; exit 1; }
          done
          echo "迁移脚本齐备"

  # 回归门禁：强制执行 tests/regression/ 全部套件（真正跑起来，不是语法检查）。
  # 任一项失败即非零退出 → CI 标红 → 阻止合并。这是合并前必须通过的红线。
  regression:
    name: 回归测试（tests/regression 全量）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 回归套件会真实加载 shell 侧模块，需要 PGlite（@electric-sql/pglite）与
      # 厂商打包的 @deepseek-ai/dsh（file:vendor/...），故先在 shell 目录装依赖。
      - name: 安装 shell 依赖
        working-directory: shell
        run: npm ci

      - name: 运行全部回归测试
        run: node scripts/run-regression.mjs
