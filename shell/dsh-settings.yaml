ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

llm-pi-ai:
  providers:
    powertokens:
      displayName: PowerTokens
      apiKeyEnv: POWERTOKENS_API_KEY
      api: openai-completions
      baseURL: https://api.powertokens.ai/v1
      # 多模态能力核实结论（2026-10-10，已核对 PT 网关 /v1/models 的 supported_endpoint_types 与官方文档）：
      # 当前手写对话模型里没有任何一个原生支持图片输入——
      #   · deepseek-v4-pro / deepseek-v3-2-251201：纯文本（DeepSeek 官方视觉模型是
      #     deepseek-flash / 已下线的 deepseek-v4-flash-vision-exp，均不在本网关）
      #   · glm-4.5-air / glm-4.7(-flash) / glm-5 / glm-5-turbo / glm-5.1 / glm-5.2：纯文本
      #     （智谱视觉模型 glm-5v-turbo / glm-5.3-flash / glm-5.3-flashx 均不在本网关）
      # 因此如实声明 [ text ]，不再用 provider 级 defaultInput:[text,image] 一刀切假设所有模型能收图。
      # 图片生成/编辑不依赖对话模型视觉，统一走 media.route 工具 + 文本 imageNote。
      defaultInput: [ text ]
      # 仅保留真正支持多轮对话的文本大模型（依据 /v1/models 的 supported_endpoint_types 含
      # anthropic/openai-response 判定为对话模型）。图片/视频/音频/TTS/生成类模型
      # （seedream/seedance/kling/wan/hailuo/speech/happyhorse/viduq/mimo/qwen-image 等）
      # 不在此列，它们只由 media.route 内部程序化选用。
      models:
        - id: MiniMax-M3
          name: MiniMax M3
        - id: deepseek-v3-2-251201
        - id: deepseek-v4-pro
        - id: glm-4.5-air
        - id: glm-4.7
        - id: glm-4.7-flash
        - id: glm-5
        - id: glm-5-turbo
        - id: glm-5.1
        - id: glm-5.2
        - id: MiniMax-M2.5
        - id: MiniMax-M2.5-highspeed
        - id: MiniMax-M2.7
        - id: MiniMax-M2.7-highspeed
        - id: qwen3-coder-plus
        - id: qwen3-max
        - id: qwen3.5-flash
        - id: qwen3.6-plus
        - id: seed-1-6-250915
        - id: seed-1-6-flash-250715
        - id: seed-1-8-251228
        - id: seed-2-0-lite-260228
        - id: seed-2-0-mini-260215
        - id: seed-2-0-pro-260328
agent-default-model:
  provider: powertokens
  model: deepseek-v4-pro

web-search-pro:
  # 免费优先：DuckDuckGo -> Bing；失败才尝试需要 key 的引擎
  engines: [ ddg, bing ]
  parallelEngines: false
  searchMaxResults: 8
  ttlSeconds: 3600
  # 让内置 web_search / web_fetch 工具也走本插件
  registerProvider: true
  # 启用 CLI 后端（gh/bili/yt-dlp 等），以便 GitHub/B站/YouTube 平台搜索可用
  enableCliBackends: true

# B6-fix-2: MCP Servers 配置
mcpServers:
  - name: ryze
    url: http://127.0.0.1:3001/mcp/ryze
    headers:
      Authorization: "Bearer ${PT_MCP_PROXY_TOKEN}"