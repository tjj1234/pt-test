ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

llm-pi-ai:
  providers:
    powertokens:
      displayName: PowerTokens
      apiKeyEnv: POWERTOKENS_API_KEY
      api: openai-completions
      baseURL: https://api.powertokens.ai/v1
      # 多模态(图片)输入:声明网关下所有手写模型默认接受 text+image,
      # 否则 pi-ai 会把未声明能力的模型按纯文本处理,图片附件不会发送。
      # 仅当消息真正附带图片时才会按 image 处理;纯文本对话不受影响。
      # 若个别模型实际不接受图片,请求会在该模型上被网关拒绝(可换模型或去掉此键)。
      defaultInput: [ text, image ]
      models:
        - id: MiniMax-M3
          name: MiniMax M3
        - id: audio1.0
        - id: deepseek-v3-2-251201
        - id: deepseek-v4-flash
        - id: deepseek-v4-pro
        - id: dola-seedream-5-0-pro-260628
        - id: dreamina-seedance-2-0-260128
        - id: dreamina-seedance-2-0-fast-260128
        - id: dreamina-seedance-2-0-mini-260615
        - id: dreamina-seedance-2-5-260628
        - id: glm-4.5-air
        - id: glm-4.7
        - id: glm-4.7-flash
        - id: glm-5
        - id: glm-5-turbo
        - id: glm-5.1
        - id: glm-5.2
        - id: happyhorse-1.1-i2v
        - id: happyhorse-1.1-r2v
        - id: happyhorse-1.1-t2v
        - id: image-01
        - id: kling-image-o1
        - id: kling-v2
        - id: kling-v2-1-master
        - id: kling-v2-5-turbo
        - id: kling-v2-new
