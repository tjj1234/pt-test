<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · PowerTokens Agent</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="login-wrap">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand">
      <div class="logo" aria-hidden="true">P</div>
      <div><h1 id="login-title">PowerTokens Agent</h1><p>你的增长小助手</p></div>
    </div>
    <p id="login-error" class="err" role="status" aria-live="polite" hidden></p>
    <button class="btn" id="google-login" type="button" disabled>正在检查登录配置…</button>
    <p class="hint" id="login-hint">使用 Google 账号登录。首次登录会为你创建独立工作区；登录后可在“我的 Key”中绑定自己的 PT Key。</p>
  </section>
</main>
<script src="/assets/google-login.js" defer></script>
