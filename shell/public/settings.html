<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账户与授权 · 北极星</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  /* 仅本页需要的小样式，全部沿用 styles.css 的 :root 变量，不新造配色 */
  .key-card{width:460px}
  .portal{display:flex;align-items:center;gap:8px;margin:18px 0 0;padding:12px 14px;
    border:1px dashed var(--line);border-radius:10px;background:#fafbff;font-size:13px}
  .portal a{font-weight:600;text-decoration:none}
  .portal .ico{font-size:15px}
  .status{font-size:13px;color:var(--sub);margin:14px 0 0}
  .keyrow{display:flex;gap:8px}
  .keyrow input{flex:1;font-family:ui-monospace,Consolas,monospace}
  .ghost{flex:0 0 auto;padding:0 14px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--sub);font-size:13px;cursor:pointer;font-family:inherit}
  .ghost:hover{border-color:var(--brand);color:var(--brand)}
  .ghost.wide{width:100%;margin-top:10px;padding:10px}
  .bound{text-align:center;padding:14px 0 4px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
    color:var(--ok);background:#e8f7ee;border-radius:999px;padding:5px 14px}
  .mask{font:600 30px/1.4 ui-monospace,Consolas,monospace;letter-spacing:2px;margin:16px 0 4px;color:var(--ink)}
  .sub{font-size:12px;color:var(--sub);margin-bottom:18px}

  /* M7：广告与数据源授权分节 */
  .acct-list{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
  .acct-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .acct-main{flex:1;min-width:0}
  .acct-type{font-size:14px;font-weight:600;color:var(--ink)}
  .acct-scope{font-size:12.5px;color:var(--sub);margin-top:3px;word-break:break-word}
  .acct-updated{font-size:11.5px;color:var(--sub);margin-top:6px;opacity:.85}
  .acct-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
  .acct-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 12px}
  .acct-badge.ok{color:#0f7a3d;background:#e8f7ee}      /* 有效：绿 */
  .acct-badge.warn{color:#9a6b00;background:#fff4d6}     /* 即将过期：琥珀 */
  .acct-badge.danger{color:#b42318;background:#fde7e4}  /* 需重验：红 */
  .acct-revoke{font-size:12.5px;color:var(--bad);background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;font-family:inherit}
  .acct-revoke:hover{border-color:var(--bad)}
  .acct-empty{padding:18px 10px;text-align:center;color:var(--sub);font-size:13px}
  @media (max-width:480px){
    .acct-item{flex-direction:column}
    .acct-side{flex-direction:row;align-items:center;justify-content:space-between;width:100%}
  }

  /* M7：解除确认弹框 */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal-card{width:min(440px,92vw);background:#fff;border-radius:14px;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal-card h3{margin:0 0 10px;font-size:16px;color:var(--ink)}
  .modal-body{margin:0 0 18px;font-size:13.5px;line-height:1.75;color:var(--sub);white-space:pre-line}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
  .btn.danger:hover{filter:brightness(.95)}
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card key-card" id="f" autocomplete="off">
    <div class="brand">
      <div class="logo">P</div>
      <div><h1>北极星</h1><p>账户与授权</p></div>
    </div>

    <section aria-labelledby="accountHeading"><h2 id="accountHeading">当前账户</h2>
      <p class="status" id="accountIdentity" role="status">读取账户信息…</p>
    </section>
    <h2>大模型与 PowerTokens Key</h2>
    <!-- 要素 1：跳转 PT 门户获取 key -->
    <div class="portal">
      <span class="ico">🔑</span>
      <span>还没有 key？</span>
      <a id="ptLink" href="#" target="_blank" rel="noopener noreferrer">前往 PowerTokens 获取 ↗</a>
    </div>

    <div class="status" id="status">读取中…</div>

    <!-- 要素 2/3/4：输入（密码型）+ 保存绑定；已绑定态下可「修改」覆盖 -->
    <div id="inputArea" style="display:none">
      <label for="key">粘贴你的 PT Key（例如 sk-…）</label>
      <div class="keyrow">
        <input id="key" type="password" placeholder="sk-…" spellcheck="false" autocomplete="off">
        <button type="button" id="toggle" class="ghost">显示</button>
      </div>
      <button class="btn" id="save" type="submit">保存绑定</button>
      <button type="button" id="cancel" class="ghost wide" style="display:none">取消修改</button>
    </div>

    <div id="boundArea" style="display:none">
      <div class="bound">
        <span class="badge">✅ 已绑定</span>
        <div class="mask" id="mask">····</div>
        <div class="sub" id="updated"></div>
      </div>
      <button type="button" class="btn" id="modify">修改 Key</button>
    </div>

    <div class="err" id="e"></div>
    <div class="hint">你的 PT key 只在你点「保存绑定」时进入浏览器内存并立即 POST 到服务端加密落库，提交后输入框马上清空；明文 key 不会写入本地存储、不会打印到控制台、也不会出现在网址里。服务端也只回显末 4 位。</div>
    <section aria-labelledby="sourcesHeading"><h2 id="sourcesHeading">广告与数据源授权</h2>
      <p class="status" id="acctStatus">读取中…</p>
      <div id="acctList" class="acct-list"></div>
    </section>
    <p><a href="/">返回工作区</a></p>
  </form>
</div>
  <div id="revokeModal" class="modal-mask" style="display:none" role="dialog" aria-modal="true" aria-labelledby="revokeTitle">
    <div class="modal-card">
      <h3 id="revokeTitle">解除授权确认</h3>
      <p class="modal-body" id="revokeBody"></p>
      <div class="modal-actions">
        <button type="button" class="ghost" id="revokeCancel">取消</button>
        <button type="button" class="btn danger" id="revokeConfirm">确认解除</button>
      </div>
    </div>
  </div>
<script src="/assets/settings.js"></script>
</body></html>
